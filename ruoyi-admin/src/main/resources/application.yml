ruoyi:
  name: LiangShan
  version: 0.1.0
  copyrightYear: 2026
  profile: ${GAME_DATA_DIR:./.local/files}
  addressEnabled: false
  captchaType: math
server:
  address: 127.0.0.1
  port: ${HTTP_PORT:8082}
  tomcat:
    threads:
      max: 64
      min-spare: 4
    accept-count: 128
    max-http-form-post-size: 256KB
spring:
  messages:
    basename: i18n/messages
  profiles:
    active: druid
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
  devtools:
    restart:
      enabled: false
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      database: 0
      password: ${REDIS_PASSWORD}
      timeout: 2s
      lettuce:
        pool:
          min-idle: 0
          max-idle: 8
          max-active: 16
          max-wait: 2s
  flyway:
    url: ${spring.datasource.druid.master.url}
    user: ${spring.datasource.druid.master.username}
    password: ${spring.datasource.druid.master.password}
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
logging:
  level:
    root: INFO
    com.ruoyi: INFO
    com.ruoyi.game.persistence: WARN
    org.springframework: WARN
user:
  password:
    maxRetryCount: 5
    lockTime: 10
token:
  header: Authorization
  secret: ${ADMIN_TOKEN_SECRET}
  expireTime: 30
mybatis:
  typeAliasesPackage: com.ruoyi.**.domain
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  configLocation: classpath:mybatis/mybatis-config.xml
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
referer:
  enabled: false
  allowed-domains: localhost,127.0.0.1
xss:
  enabled: true
  excludes: /system/notice
  urlPatterns: /system/*,/monitor/*
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
game:
  ws:
    port: ${WS_PORT:8081}
  allowed-origins: ${GAME_ALLOWED_ORIGINS:http://localhost:8080,http://127.0.0.1:8080,http://localhost:7456,http://127.0.0.1:7456,http://localhost:7501,http://127.0.0.1:7501}
  guest-credential-days: 365
