# localhost 隔离验证：避免 Mac -> VM -> Mac 的业务代理回绕。
worker_processes 1;
worker_rlimit_nofile 16384;
pid nginx.pid;
error_log error.log warn;
events { worker_connections 8192; }
http {
    log_format safe '$remote_addr [$time_iso8601] $request_method $uri $status';
    access_log access.log safe;
    client_body_temp_path tmp/client;
    proxy_temp_path tmp/proxy;
    upstream game_http { server 127.0.0.1:8082; keepalive 32; }
    upstream game_ws { server 127.0.0.1:8081; }
    map $http_upgrade $business_upstream { default game_ws; '' game_http; }
    map $http_upgrade $connection_upgrade { default upgrade; '' ''; }
    server {
        listen 127.0.0.1:8080;
        client_max_body_size 256k;
        add_header X-Liangshan-Proxy host-native always;
        location / {
            proxy_pass http://$business_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header Origin $http_origin;
            proxy_connect_timeout 3s;
            proxy_read_timeout 120s;
        }
    }
}
